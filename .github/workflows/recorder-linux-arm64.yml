# Proves the recorder works on Linux ARM64 (the Oracle Cloud server's platform) on every change
# to it: tests, the end-to-end recording self-test, and a full rehearsal of the server install
# with real systemd services. F1 refuses GitHub's network, so the live feed is not tested here
# (tools/server-preflight.mjs does that on the server itself).
name: Recorder on Linux ARM64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server.mjs', 'recorder.mjs', 'kalshi.mjs', 'racesim.js', 'ingest.mjs', 'shipper.mjs', 'transport.mjs', 'tools/**', 'tests/**', 'deploy/**', '.github/workflows/recorder-linux-arm64.yml']
permissions:
  contents: read
jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright-core@1.65.1
          npx playwright-core install --with-deps chromium
      - name: F1 network check from GitHub's network (evidence; expected to be refused)
        continue-on-error: true
        run: |
          node tools/f1-net-preflight.mjs --json > net.json || true; cat net.json
          echo "::notice title=f1net::$(python3 -c "import json; d=json.load(open('net.json')); print(d['verdict'], '|', ' ; '.join(f\"{c['name']}: {c.get('status')} by={c.get('answeredBy')} server={c.get('headers',{}).get('server')} xcache={c.get('headers',{}).get('x-cache')} body={c.get('body','')[:120]}\" for c in d['checks']))")"
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Recording self-test (record, crash, restart, replay, compress, browser)
        run: node tools/selftest-recording.mjs
      - name: Collector → backend pipeline self-test (14 failure scenarios, incl. rclone backup)
        run: |
          sudo apt-get install -y -q rclone >/dev/null
          node tools/selftest-pipeline.mjs | tee pipeline.txt
          echo "::notice title=pipeline::$(grep -cE '^ok' pipeline.txt) ok, $(grep -cE '^FAIL' pipeline.txt) failed; $(grep -E '\[(7|14)\]' pipeline.txt | tr '\n' ' ' | cut -c1-600)"
      - name: Install without approval enables nothing
        run: |
          sudo PITWALL_ROLE=standalone bash deploy/oracle/install.sh
          st=$(systemctl is-enabled pitwall-relay.service pitwall-session.timer pitwall-health.timer pitwall-maintain.timer pitwall-ingest.service 2>&1 | tr '\n' ' ')
          echo "::notice title=noenable::$st"
          ! echo "$st" | grep -qw enabled
          ! systemctl is-active --quiet pitwall-relay.service
      - name: Rehearse the server install (systemd), services approved
        run: sudo PITWALL_ROLE=standalone ENABLE_SERVICES=1 bash deploy/oracle/install.sh
      - name: Services running, crash recovery, health and maintenance
        run: |
          note() { echo "::notice title=$1::$2"; }
          sleep 15
          note relay "$(systemctl is-active pitwall-relay.service)"
          note timers "$(systemctl list-timers 'pitwall*' --no-pager --no-legend | awk '{print $NF}' | tr '\n' ' ')"
          h=$(curl -sf http://127.0.0.1:8765/api/health) && note health "$h" || { note health "no answer"; exit 1; }
          pid=$(systemctl show -p MainPID --value pitwall-relay.service)
          sudo kill -9 "$pid"; sleep 6
          new=$(systemctl show -p MainPID --value pitwall-relay.service)
          if [ "$new" != "$pid" ] && [ "$new" != 0 ] && curl -sf http://127.0.0.1:8765/api/health >/dev/null; then note crash "relay killed ($pid), systemd restarted it ($new), answering"; else note crash "NOT restarted"; exit 1; fi
          note healthcheck "$(sudo -u pitwall bash -c 'set -a; . /etc/pitwall/pitwall.env; cd /opt/pitwall && node tools/health.mjs' 2>&1 | tail -3 | tr '\n' ' ')"
          sudo systemctl start pitwall-health.service && note healthservice "$(systemctl show -p Result --value pitwall-health.service) $(sudo cat /opt/pitwall/data/health.json | tr -d '\n' | cut -c1-400)"
          sudo logrotate -f /etc/logrotate.d/pitwall && note logrotate "rotated: $(sudo ls /opt/pitwall/data/ | grep -c '\.log\.1') files"
          sudo -u pitwall sudo -n systemctl start pitwall-maintain.service && note maintain "$(sudo cat /opt/pitwall/data/maintain.json | tr -d '\n')"
          sudo systemctl start pitwall-session.service; sleep 5
          note session "$(sudo tail -3 /opt/pitwall/data/session.log | tr '\n' ' ') state=$(systemctl is-active pitwall-session.service)"
      - name: Backend ingest under systemd (signed requests only, restart after kill -9)
        run: |
          note() { echo "::notice title=$1::$2"; }
          sudo sh -c 'umask 077; openssl rand -hex 32 > /etc/pitwall/ingest-secret'; sudo chown root:pitwall /etc/pitwall/ingest-secret; sudo chmod 640 /etc/pitwall/ingest-secret
          sudo systemctl start pitwall-ingest.service; sleep 3
          curl -sf http://127.0.0.1:8770/healthz >/dev/null || { sudo tail -20 /opt/pitwall/data/ingest.log; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST 'http://127.0.0.1:8770/v1/append?dir=2026-x-y-1&file=feed.tsv&offset=0' --data-binary 'x')
          [ "$code" = 401 ] || { echo "unsigned request got $code"; exit 1; }
          pid=$(systemctl show -p MainPID --value pitwall-ingest.service); sudo kill -9 "$pid"; sleep 5
          new=$(systemctl show -p MainPID --value pitwall-ingest.service)
          curl -sf http://127.0.0.1:8770/healthz >/dev/null && [ "$new" != "$pid" ] && note ingest "listening on 127.0.0.1 only ($(ss -ltn | grep -c ':8770 ')), unsigned → 401, restarted after kill -9" || { note ingest "NOT restarted"; exit 1; }
          ss -ltn | grep ':8770 ' | grep -v '127.0.0.1' && { echo "ingest listening publicly"; exit 1; } || true
      - name: What this network gets from F1 (expected to be refused on GitHub)
        continue-on-error: true
        run: |
          out=$(sudo -u pitwall bash -c 'set -a; . /etc/pitwall/pitwall.env; cd /opt/pitwall && node tools/server-preflight.mjs' 2>&1 || true); echo "$out"
          echo "::notice title=preflight::$(echo "$out" | tr '\n' ' ')"
      - name: Logs
        if: always()
        run: |
          sudo tail -40 /opt/pitwall/data/relay.log /opt/pitwall/data/health.log 2>/dev/null || true
          echo "::notice title=relaylog::$(sudo tail -8 /opt/pitwall/data/relay.log 2>/dev/null | tr '\n' ' ')"
